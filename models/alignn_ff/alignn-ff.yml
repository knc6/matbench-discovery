environment:
  dependencies:
    - alignn
    - ase
    - numpy
    - pandas
    - torch
  python_version: '3.11'

openness: OSOD
architecture_types: [gnn]
train_task: S2EFS
test_task: IS2RE-SR
targets: EFS_G
training_sets: [MPtrj]
model_params: 547097

hyperparams:
  architecture:
    graph_construction_radius: 8.0
    max_neighbors: 12
  evaluation:
    ase_optimizer: FIRE
    cell_filter: FrechetCellFilter
    max_steps: 500
    max_force: 0.05

notes:
  description: |
    ALIGNN-FF is a pure-PyTorch line-graph GNN force field. This entry uses the
    refreshed MPtrj-trained checkpoint (mptrj_smooth), relaxing the WBM initial
    structures with FIRE + FrechetCellFilter. Formation energies use self-consistent
    per-model elemental references over the full 256,963-structure WBM set.

